<!doctype html>

<title>A Day at Monroe &amp; Delacroix</title>
<style>
  :root{
    --ink:#1d1a2b; --muted:#5d5a70; --paper:#fffdf7; --desk:#2b2350; --desk2:#463a7a;
    --gold:#f5c542; --line:#d9d4c4; --good:#1f7a4d; --mixed:#9a6400; --bad:#b3261e;
    --accent:#461d7c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);

  button{font:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .wrap{max-width:1060px;margin:0 auto;padding:16px}

  /* top bar */
  .bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;background:#17122e;color:#fff;
    border-radius:12px;padding:10px 16px;margin-bottom:14px}
  .bar .firm{font-weight:700}
  .bar .team{color:var(--gold);font-weight:600}
  .clock{font-variant-numeric:tabular-nums;font-weight:700;background:#000;border-radius:8px;padding:2px 10px;color:#7CFFB2}
  .meter{display:flex;align-items:center;gap:6px;font-size:14px}
  .meter .track{display:inline-block;width:110px;height:12px;background:#3a335c;border-radius:6px;overflow:hidden}
  .meter .fill{display:block;height:100%;width:0;transition:width .5s}
  #riskFill{background:#ff6b5e} #prodFill{background:#5fd68f}
  .score{margin-left:auto;font-size:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .net{font-size:12px;color:#b9b4d6}

  /* windows */
  .window{background:var(--paper);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
  .titlebar{background:#e9e4d4;border-bottom:1px solid var(--line);padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);
    display:flex;gap:8px;align-items:center}
  .dots{display:inline-flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;background:#c9c3b0;display:inline-block}
  .pad{padding:20px 22px}
  .grid{display:grid;grid-template-columns:260px 1fr;gap:14px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}.score{margin-left:0}}

  .inbox{list-style:none;margin:0;padding:0}
  .inbox li{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .inbox li.current{background:#fff3c9;font-weight:700}
  .inbox li.done{color:var(--muted)}
  .inbox li.locked{color:#77726a;font-style:italic}
  .inbox .t{display:block;font-size:12px;color:var(--muted);font-weight:400}

  .mailhead{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;font-size:15px}
  .mailhead b{display:inline-block;min-width:70px;color:var(--muted);font-weight:600}
  h1{font-size:34px;margin:0 0 6px} h2{font-size:22px;margin:0 0 10px} h3{font-size:17px;margin:18px 0 6px}
  .narr{background:#f3efe2;border-left:4px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0}
  blockquote{margin:10px 0 4px;padding:8px 14px;border-left:4px solid var(--line);background:#f8f5ea;border-radius:0 8px 8px 0}
  blockquote p{margin:6px 0}

  .choices{display:grid;gap:10px;margin-top:16px}
  .choice{text-align:left;background:#fff;border:2px solid var(--accent);border-radius:10px;padding:12px 16px;color:var(--ink)}
  .choice:hover{background:#f1eaff}
  .choice b{color:var(--accent)}
  .primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700}
  .primary:hover{background:#5d2aa3}
  .ghost{background:transparent;border:2px solid var(--accent);color:var(--accent);border-radius:10px;padding:10px 18px;font-weight:600}

  .result{border-radius:10px;padding:14px 18px;margin:8px 0 16px;border:2px solid}
  .result.good{border-color:var(--good);background:#e9f7ef}
  .result.mixed{border-color:var(--mixed);background:#fff6e0}
  .result.bad{border-color:var(--bad);background:#fdecea}
  .tag{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
  .good .tag{color:var(--good)} .mixed .tag{color:var(--mixed)} .bad .tag{color:var(--bad)}
  .delta{font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:0}
  details{margin:0 0 16px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff}
  summary{cursor:pointer;font-weight:600;color:var(--accent)}

  /* title */
  .hero{max-width:680px;margin:6vh auto 0}
  .name{font-size:26px;font-weight:800;color:var(--accent);margin:8px 0 14px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

  /* report */
  .report h2{border-bottom:2px solid var(--ink);padding-bottom:6px}
  .big{font-size:64px;font-weight:900;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
  .item{border-top:1px solid var(--line);padding:14px 0}
  .item .issue{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  .tripod{margin:8px 0 0;padding-left:20px}
  .tripod li{margin:3px 0}
  .small{font-size:13px;color:var(--muted)}
  table.legs{width:100%;border-collapse:collapse;margin:10px 0}
  table.legs th,table.legs td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.legs thead th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  table.legs tr.top td,table.legs tr.top th{background:#fff3c9}
</style>
</head>

 "high": "I'm fine. A sprained ankle and a lecture about stairs. I read through yesterday's messages. You handled my day better than I would have. Take a long lunch.",
 "middle": "I'm fine. A sprained ankle and a lecture about stairs. I read through yesterday's messages. Mostly good. We'll go over a few things when I'm back. Nothing that can't be fixed.",

};

/* ---------- state ---------- */
let S = load() || fresh();

function fresh(){ return {team:"", ready:false, idx:0, risk:0, prod:0, log:[], pending:null, predict:"", done:false}; }
function load(){ try{ return JSON.parse(localStorage.getItem(STORE)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
function score(){ return Math.max(0, 100 + 10*S.prod - 15*S.risk); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function randomName(){ return "The " + pick(ADJ) + " " + pick(NOUN); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function best(sc){ return sc.choices.find(c=>c.verdict==="good"); }
function chosen(sc){ const e = S.log.find(l=>l.id===sc.id); return e ? sc.choices[e.n] : null; }

/* ---------- leaderboard ---------- */
let netOK = null;
function post(){
  if(!S.team) return;
  const body = {team:S.team, score:score(), scene:S.done?99:S.idx, updated_at:new Date().toISOString()};
  fetch(SB_URL+"/rest/v1/scores?on_conflict=team", {
    method:"POST",
    headers:{apikey:SB_KEY,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify(body)
  }).then(r=>{netOK=r.ok;}).catch(()=>{netOK=false;}).finally(()=>{
    const n=document.getElementById("net"); if(n) n.textContent = netOK ? "Leaderboard: connected" : "Leaderboard: offline (keep playing)";
  });
}

/* ---------- rendering ---------- */
const app = document.getElementById("app");

function render(){
  if(!S.team) return renderTitle();
  if(!S.ready) return renderOpener();
  if(S.done && !S.predict) return renderPredict();
  if(S.done) return renderReport();
  renderDesk();
}

function renderTitle(){
  let name = randomName();
  app.innerHTML = `
  <div class="hero">
    <div class="window">
      <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span> Welcome to ${esc(FIRM)}</div>
      <div class="pad">
        <h1>A Day at Monroe &amp; Delacroix</h1>
        <p>You are a second-year associate. ${SCENES.length} things will land on your desk between 8:00 and 6:00. For each one, your team picks what to do.</p>
        <p>Every choice moves two meters: <b>Malpractice risk</b> and <b>Productivity</b>. Fast is not always safe, and safe is not always slow. At 6:00 the firm's malpractice carrier files its report on you.</p>
        <h3>Your team name</h3>
        <div class="name" id="nm" aria-live="polite">${esc(name)}</div>
        <div class="row">
          <button class="ghost" id="shuffle">Shuffle name</button>
          <button class="primary" id="go">Continue</button>
        </div>
        <p class="small">Names are drawn from a preset list. Your team's score appears on the class leaderboard under this name.</p>
      </div>
    </div>
  </div>`;
  document.getElementById("shuffle").onclick = ()=>{ name = randomName(); document.getElementById("nm").textContent = name; };
  document.getElementById("go").onclick = ()=>{ S = fresh(); S.team = name; save(); post(); render(); };
}

/* Preparation: teams recall the three legs before the first scene. Not scored. */
function renderOpener(){
  app.innerHTML = `
  <div class="hero">
    <div class="window">
      <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span> Before the day starts</div>
      <div class="pad">
        <h2>Three legs, three questions</h2>
        <p>Whelan's book rests on three legs: <b>process</b>, <b>ethics</b> and <b>technology</b>. Each leg asks one question about a problem in a law practice.</p>
        <p>As a team, write down from memory the question each leg asks. No notes. When you have all three, check them.</p>
        <div id="legq"><button class="ghost" id="reveal">Check our three questions</button></div>
      </div>
    </div>
  </div>`;
  document.getElementById("reveal").onclick = ()=>{
    document.getElementById("legq").innerHTML = `
      <div role="status">
        <ul class="tripod">${LEG_Q.map(([k,q])=>`<li><b>${k}:</b> ${esc(q)}</li>`).join("")}</ul>
        <p>Keep all three in view today. At 6:00 the report will show which leg your team neglected most.</p>
      </div>
      <button class="primary" id="start">Start the day</button>`;

}

function barHTML(clock){
  const maxRisk = SCENES.reduce((t,x)=>t+Math.max(...x.choices.map(c=>c.risk)),0), maxProd = SCENES.reduce((t,x)=>t+Math.max(...x.choices.map(c=>c.prod)),0);
  return `
  <div class="bar">
    <span class="firm">${esc(FIRM)}</span>
    <span class="team">${esc(S.team)}</span>
    <span class="clock" aria-label="Time of day">${esc(clock)}</span>
    <span class="meter">Risk <span class="track"><span class="fill" id="riskFill" style="width:${Math.min(100,S.risk/maxRisk*100)}%"></span></span></span>
    <span class="meter">Productivity <span class="track"><span class="fill" id="prodFill" style="width:${Math.max(0,Math.min(100,S.prod/maxProd*100))}%"></span></span></span>
    <span class="score" aria-label="Score">${score()}</span>
    <span class="net" id="net">${netOK===false?"Leaderboard: offline (keep playing)":"Leaderboard: connected"}</span>
  </div>`;
}

function inboxHTML(){
  return `<ul class="inbox">` + SCENES.map((sc,i)=>{
    const cls = i<S.idx ? "done" : i===S.idx ? "current" : "locked";
    const label = i<=S.idx ? esc(sc.title) : "Not yet arrived";
    return `<li class="${cls}"><span class="t">${esc(sc.time)}</span>${i<S.idx?"✓ ":""}${label}</li>`;
  }).join("") + `</ul>`;
}

function tripodHTML(c){ return `<ul class="tripod">${c.tripod.map(([k,t])=>`<li><b>${esc(k)}:</b> ${esc(t)}</li>`).join("")}</ul>`; }
function fullTripodHTML(c){ return `<ul class="tripod">${c.ftripod.map(([k,t])=>`<li><b>${esc(k)}:</b> ${esc(t)}</li>`).join("")}</ul>`; }
/* The letter a choice carried on this team's screen, since choices are shuffled. */
function letterFor(sc, c){ return "ABCD"[orderFor(sc).indexOf(sc.choices.indexOf(c))]; }
function quoteHTML(sc){ return `<blockquote>${sc.quotes.map(q=>`<p>${esc(q)}</p>`).join("")}</blockquote><p class="small">${esc(sc.chapter)}</p>`; }

/* What a team sees after it chooses: the reply email, then the explanation. */
function resultHTML(sc, c){
  const b = best(sc);
  return `
    <div class="mailhead">
      <div><b>From</b> ${esc(sc.from)} &lt;${esc(sc.addr)}&gt;${sc.replyNote?` <span class="small">(${esc(sc.replyNote)})</span>`:""}</div>
      <div><b>Subject</b> Re: ${esc(sc.title)}</div>
    </div>
    <p>${esc(c.reply)}</p>
    <div class="result ${c.verdict}" role="status">
      <div class="tag">${VERDICT[c.verdict]}</div>
      <p style="margin:4px 0 8px">${esc(c.full)}</p>
      ${c.verdict==="good" ? fullTripodHTML(c) : `<p style="margin:0 0 8px"><b>The better answer is ${letterFor(sc, b)}:</b> ${esc(c.better)}</p>`}
      <p class="delta">Risk ${c.risk>0?"+":""}${c.risk} · Productivity ${c.prod>0?"+":""}${c.prod}</p>
    </div>
    <details>
      <summary>${c.verdict==="good" ? "Read the passage" : "Read the passage and the best answer"}</summary>
      ${quoteHTML(sc)}
      ${c.verdict==="good" ? "" : `<h3>Best answer</h3><p>${esc(b.label)}</p>${tripodHTML(b)}`}
    </details>`;
}

function renderDesk(){
  const sc = SCENES[S.idx];
  const answered = S.pending!==null && S.pending!==undefined;
  let main;
  if(answered){
    main = resultHTML(sc, sc.choices[S.pending]) +
      `<button class="primary" id="next">${S.idx+1<SCENES.length?"Back to work":"Go home"}</button>`;
  } else {
    main = `<h2>${esc(sc.title)}</h2><div class="narr">${esc(sc.setup)}</div>
      <h3>${esc(sc.question)}</h3><div class="choices">` +
      orderFor(sc).map((ci,pos)=>`<button class="choice" data-i="${ci}"><b>${"ABCD"[pos]}.</b> ${esc(sc.choices[ci].label)}</button>`).join("") + `</div>`;
  }
  app.innerHTML = barHTML(sc.time) + `
  <div class="grid">
    <div class="window"><div class="titlebar">Inbox</div>${inboxHTML()}</div>
    <div class="window"><div class="titlebar"><span class="dots"><i></i><i></i><i></i></span> ${esc(sc.time)} · ${esc(sc.chapter)}</div><div class="pad">${main}</div></div>
  </div>`;

  if(answered){
    document.getElementById("next").onclick = ()=>{
      S.pending = null; S.idx++; if(S.idx>=SCENES.length){ S.done = true; }
      save(); post(); render(); window.scrollTo(0,0);
    };
    document.getElementById("next").focus();
  } else {
    app.querySelectorAll(".choice").forEach(b=>b.onclick = ()=>choose(sc, +b.dataset.i));
  }
}

/* Choices appear in a random order so the best answer is not always in the same spot. */
function orderFor(sc){
  const ORDER = (S.order = S.order || {});   /* kept with the team's state, so a reload shows the same letters */
  if(!ORDER[sc.id]){ const a=sc.choices.map((_,i)=>i); for(let k=a.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1)); [a[k],a[r]]=[a[r],a[k]];} ORDER[sc.id]=a; save(); }
  return ORDER[sc.id];
}
function choose(sc, i){
  const c = sc.choices[i];
  S.risk += c.risk; S.prod += c.prod;
  S.log.push({id:sc.id, n:i});
  S.pending = i;
  save(); render(); window.scrollTo(0,0);
}

/* Feedback, step 1: the team assesses itself before it sees the record. */
function renderPredict(){
  app.innerHTML = barHTML("6:00 PM") + `
  <div class="hero" style="margin-top:2vh">
    <div class="window">
      <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span> Before you read the carrier's report</div>
      <div class="pad">
        <h2>Which leg did your team neglect most today?</h2>
        <p>Think back over the choices that were not the best answer. Agree on one leg as a team. The report will show what the record says.</p>
        <div class="choices">${LEGS.map(([k,name])=>`<button class="choice" data-k="${k}"><b>${name}</b></button>`).join("")}</div>
      </div>
    </div>
  </div>`;
  app.querySelectorAll(".choice").forEach(b=>b.onclick = ()=>{ S.predict = b.dataset.k; save(); render(); window.scrollTo(0,0); });
}

/* For each leg: the scenes where a weaker option neglected it (chances) and the ones where this team chose such an option (missed). */
function legStats(){
  return LEGS.map(([k,name])=>{
    const chances = SCENES.filter(s=>s.choices.some(c=>c.legs.includes(k)));
    const missed = chances.filter(s=>{ const c = chosen(s); return c && c.legs.includes(k); });
    return {k, name, chances:chances.length, missed, rate: chances.length ? missed.length/chances.length : 0};
  });
}

function legReportHTML(){
  const st = legStats();
  const weaker = SCENES.filter(s=>{ const c = chosen(s); return c && c.verdict!=="good"; }).length;
  const topRate = Math.max(...st.map(x=>x.rate));
  const top = topRate>0 ? st.filter(x=>x.rate===topRate) : [];
  let verdict;
  if(!top.length) verdict = "The record shows no neglected leg. Every choice your team made was the best answer.";
  else {
    const names = top.map(x=>x.name).join(" and ");
    verdict = `The record points to <b>${names}</b>, measured as misses out of chances. ` +
      (top.some(x=>x.k===S.predict) ? "Your team's prediction matches the record." : "Your team's prediction does not match the record. Why might that be?");
    if(weaker<=2) verdict += ` Your team made only ${weaker} weaker ${weaker===1?"choice":"choices"} all day, so treat this as a hint, not a pattern.`;
  }
  return `
    <h3>The three legs</h3>
    <p>Your team predicted: <b>${esc(LEG_NAME[S.predict]||"")}</b>. ${verdict}</p>
    <table class="legs">
      <thead><tr><th scope="col">Leg</th><th scope="col">Neglected</th><th scope="col">In these scenes</th></tr></thead>
      <tbody>${st.map(x=>`<tr class="${top.includes(x)?"top":""}"><th scope="row">${x.name}</th><td>${x.missed.length} of ${x.chances} chances</td><td>${x.missed.length ? x.missed.map(s=>esc(s.time+" "+s.title)).join("; ") : "None"}</td></tr>`).join("")}</tbody>
    </table>
    <p class="small">A chance is a scene in which at least one weaker option neglected that leg. The legs do not come up equally often, so compare the fractions, not the counts.</p>`;
}

function renderReport(){
  const sc = score();
  const rating = sc>=HIGH ? "Policy renewed at the standard premium. The underwriter sends her regards."
              : sc>=MID ? "Policy renewed, with a strongly worded letter."
              : "Please call us. Today. Before you open any more email.";
  const closing = sc>=HIGH ? CLOSING.high : sc>=MID ? CLOSING.middle : CLOSING.low;
  app.innerHTML = barHTML("6:00 PM") + `
  <div class="window report"><div class="titlebar"><span class="dots"><i></i><i></i><i></i></span> Bayou Mutual Professional Liability — Insured's Daily Report</div>
   <div class="pad">
    <h2>Carrier's report on ${esc(S.team)}</h2>
    <div class="row" style="gap:24px;align-items:flex-end">
      <div><div class="small">FINAL SCORE</div><div class="big">${sc}</div></div>
      <div><b>${esc(rating)}</b><br><span class="small">Risk ${S.risk} · Productivity ${S.prod}</span></div>
    </div>
    <div class="narr"><span class="small">A last email from Ms. Delacroix, sent from the hospital the next morning</span><br>${esc(closing)}</div>
    ${legReportHTML()}
    <h3>Scene by scene</h3>
    <p>Hold on to this page for the class discussion.</p>
    ${SCENES.map(scn=>{
      const c = chosen(scn), b = best(scn);
      if(!c) return "";
      return `<div class="item">
        <div class="issue">${esc(scn.time)} · ${esc(scn.title)}</div>
        <div class="result ${c.verdict}" style="margin:8px 0"><span class="tag">${VERDICT[c.verdict]}</span><div>${esc(c.label)}</div>
          ${c.verdict==="good" ? "" : `<p style="margin:8px 0 0">${esc(c.expl)}</p>${c.legs.length ? `<p class="small" style="margin:6px 0 0">Leg neglected: ${esc(c.legs.map(k=>LEG_NAME[k]).join(", "))}</p>` : ""}`}
        </div>
        ${quoteHTML(scn)}
        ${c.verdict==="good" ? "" : `<p style="margin-bottom:0"><b>Best answer:</b> ${esc(b.label)}</p>`}
        ${tripodHTML(b)}
      </div>`;
    }).join("")}
    <p style="margin-top:20px"><button class="ghost" id="again">Start over with a new team name</button></p>
   </div></div>`;
  document.getElementById("again").onclick = ()=>{
    if(confirm("Start a new day? This team's score stays on the leaderboard.")){ S = fresh(); save(); render(); }
  };
}

render();
if(S.team) post();
</script>
</body>
</html>
